<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS embutido</title>
    <style>
     em {  color: orange;
      }
    code {color: lime; 
        
        text-decoration: underline;
        }
       /* font-family: sans-serif;
        */
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS embutido</h1>
        <p>Você pode aplicar um estilo <em style="color: orange;">embutido</em> para um elemento usando o atributo <code style="color: lime; text-decoration: underline; font-family: sans-serif;">style.</code></p>
    </main>
    
</body>
</html>
