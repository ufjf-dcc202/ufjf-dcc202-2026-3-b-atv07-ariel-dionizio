<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS externo</title>
    <style>
     em {  color: orange;
      }
    code {color: lime; 
        
        text-decoration: underline;
        }
       /* font-family: sans-serif;
        */
        dt > code {
             background-color: black;
            color: white;
           
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS externo</h1>
        <p>Você pode aplicar um estilo <em style="color: orange;">embutido</em> para um elemento usando o atributo <code style="color: lime; text-decoration: underline; font-family: sans-serif;">style.</code></p>
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera a cor texto do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Altera a cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
    
</body>
</html>
